<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 4 JavaScript Fundamentals</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 id="heading">JavaScript Fundamentals</h1>

    <p id="message">Welcome to my Week 4 project.</p>

    <button id="changeButton">Click Me</button>
<hr>

<h2>Simple Calculator</h2>

<input type="number" id="num1" placeholder="First number">

<input type="number" id="num2" placeholder="Second number">

<div>
    <button id="calculateButton">Add (+)</button>
    <button id="subtractButton">Subtract (-)</button>
    <button id="multiplyButton">Multiply (×)</button>
    <button id="divideButton">Divide (÷)</button>
</div>

<h3 id="result">Result will appear here</h3>
<hr>

<h2>Student Grade Tracker</h2>

<input type="text" id="studentName" placeholder="Enter student name">

<input type="number" id="studentMarks" placeholder="Enter marks">

<button id="gradeButton">Check Grade</button>

<h3 id="gradeResult">Student grade will appear here</h3>
    <script src="script.js"></script>
</body>
</html>
